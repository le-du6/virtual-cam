# Projet XcodeGen — générer avec : xcodegen generate  (ou scripts/run.sh)
name: MaCam

options:
  bundleIdPrefix: fr.stelau
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 7SZV3KLD2V        # ← votre Team ID Apple Developer (10 caractères)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"        # surchargé par scripts/run.sh à chaque build
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:

  # Application hôte : capture caméra, composition, envoi vers l'extension, barre des menus
  MaCam:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: MaCamExtension
        embed: true                     # → Contents/Library/SystemExtensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.stelau.macam
        PRODUCT_NAME: MaCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: MaCam
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: "MaCam utilise votre caméra pour composer l'image envoyée à la caméra virtuelle."
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.device.camera: true
    scheme: {}

  # Extension caméra (CoreMediaIO) : c'est elle que Teams, Zoom, FaceTime… voient
  MaCamExtension:
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.stelau.macam.extension
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)   # le bundle doit porter le nom de son identifiant
        SKIP_INSTALL: YES
    info:
      path: Config/Extension-Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        NSSystemExtensionUsageDescription: "Fournit la caméra virtuelle MaCam."
    entitlements:
      path: Config/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)fr.stelau.macam.extension
