<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A57"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond : squircle macOS (grille 824/1024) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Glyphe duotone : objectif (couche secondaire, 40 %) -->
  <path d="M 636 470 L 766 392 Q 800 372 800 412 L 800 612 Q 800 652 766 632 L 636 554 Z"
        fill="#2EC4B6" fill-opacity="0.42"/>

  <!-- Glyphe duotone : boîtier (couche primaire) -->
  <rect x="224" y="352" width="396" height="320" rx="68" fill="#2EC4B6"/>

  <!-- Bandeau (lower third) découpé dans le boîtier, avec accent orange -->
  <rect x="268" y="556" width="236" height="62" rx="16" fill="#0E2132"/>
  <rect x="268" y="556" width="34" height="62" rx="12" fill="#F28C28"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
